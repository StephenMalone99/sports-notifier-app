name: Sports alerts

on:
  # Main trigger: an external timer (cron-job.org) starts this every 10 minutes
  # through GitHub's API - those runs start within seconds.
  workflow_dispatch:          # also lets you run it by hand from the Actions tab
  # Backup only: GitHub's own timer is often late and sometimes skips runs.
  schedule:
    - cron: "37 * * * *"

# Least privilege: this job can only read the code, nothing else.
# Actions are pinned to commit SHAs so a moved tag can't change what runs
# while the API keys are loaded.
permissions:
  contents: read

concurrency:
  group: sports-alerts
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10   # every run is a quick check (about 1 minute)
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      # Pinned versions only (see requirements-ci.txt)
      - run: pip install --no-deps -r requirements-ci.txt

      # Remembers which alerts were already sent, so nothing repeats.
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: state
          key: sent-${{ github.run_id }}
          restore-keys: sent-

      - name: Fetch events and send alerts
        env:
          # Pulled from Settings > Secrets and variables > Actions. GitHub masks
          # them as *** if they ever appear in logs.
          PANDASCORE_TOKEN: ${{ secrets.PANDASCORE_TOKEN }}
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          SPORTSAPIPRO_KEY: ${{ secrets.SPORTSAPIPRO_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m notifier.notify

      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: always()
        with:
          path: state
          key: sent-${{ github.run_id }}

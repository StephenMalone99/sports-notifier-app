# Settings (no secrets in here — keys live in Windows Credential Manager / GitHub Secrets)

timezone: Europe/Dublin        # times on the dashboard and in alerts

cs2:
  tiers: [s]                   # PandaScore tiers to track. Add "a" for more events.
  always_include:              # tracked whatever tier PandaScore gives them
    - Major
    - ESL Pro League
    - IEM
    - BLAST
    - PGL
    - Esports World Cup
  exclude:                     # never tracked (smaller side events)
    - Qualifier
    - Conference
    - Academy
  favourite_teams:             # matches at ANY event + reminder before they play
    Team Spirit: [Spirit]          # other names PandaScore may use
    NAVI: [Natus Vincere, NaVi]
    FaZe Clan: [FaZe]
    Vitality: [Team Vitality]
    Team Falcons: [Falcons]
  remind_minutes_before: 60    # ping this long before a favourite team plays
  live_alerts: true            # "Live now" / "Running late" pings for favourite-team matches
  late_after_minutes: 10       # say "running late" once a match is this far past its start time
  match_days_ahead: 7          # how far ahead to list matches in tracked events
  favourite_days_ahead: 14     # how far ahead to look for favourite teams' matches

liverpool:
  remind_minutes_before: 60    # phone ping this long before kick-off
  lineups: true                # wait for the starting XIs and include them in the ping
  sportsapipro_team_id: 44     # Liverpool's id on SportsAPI Pro (for official line-ups)
  tv:                          # where to watch (Ireland, 2026/27). Matched on competition name.
    Premier League: Sky Sports, TNT Sports or Premier Sports
    Champions League: Premier Sports (Tue), RTÉ (Wed) or Virgin Media
    League Cup: Sky Sports
    default: check listings

darts:
  # Match-ups come from SportsAPI Pro on PDC event days (free plan: 100 requests/day).
  # Matches are kept when the tournament name matches today's event in data/darts.yaml
  # or a name below; names in exclude are always skipped.
  include: []
  exclude: [modus, challenge tour, development tour, women, youth, wdf, super series]
  refresh_minutes: 30          # how often to re-fetch match-ups on event days (saves API requests)
  stats: true                  # add averages, 180s and checkout % to darts results
  results_players:             # darts results for these players (plus every semi-final and final)
    - Luke Littler
    - Luke Humphries
    - Michael van Gerwen
    - Gian van Veen
    - Gerwyn Price
    - Stephen Bunting
    - Josh Rock

f1:
  sessions: [Sprint Qualifying, Sprint, Qualifying, Race]   # add Practice 1/2/3 if wanted
  remind: [Qualifying, Sprint, Race]                         # phone ping before these
  remind_minutes_before: 60
  tv: Sky Sports F1 / NOW

results:                       # score alerts after games - set enabled: false for no spoilers
  enabled: true
  liverpool: true
  cs2_favourites: true
  f1: true                     # podium after the sprint and race
  darts: true                  # darts results (see darts.results_players)

notifications:
  daily_digest_time: "07:30"   # morning summary of today's events (local time)
  max_gap_minutes: 35          # warn if no check has run for this long (timer problem)
  time_changes: true           # ping when your matches/sessions are delayed, moved or postponed
  time_change_minutes: 15      # ignore smaller shifts
  ntfy_server: https://ntfy.sh

dashboard:
  refresh_hours: 3             # how often the local page re-fetches data
  days_ahead: 90               # how far ahead to show
  f1_weekends: 4               # how many upcoming Grand Prix weekends to show
